<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙軌雙向轉乘查詢</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .card { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 480px; margin: 0 auto 16px; }
    h2 { margin: 0 0 16px; font-size: 18px; text-align: center; color: #0056b3; }
    .btn-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-group button { flex: 1; padding: 10px; border: 1px solid #0056b3; background: #fff; color: #0056b3; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-group button.active { background: #0056b3; color: #fff; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    .query-btn { width: 100%; padding: 12px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .result-card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; border-left: 5px solid #0056b3; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .tag { display: inline-block; padding: 2px 6px; font-size: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 6px; }
    .tag-tra { background: #e3f2fd; color: #0d47a1; }
    .tag-hsr { background: #fff3e0; color: #e65100; }
    .time-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 15px; }
    .train-info { font-size: 13px; color: #666; }
    .transfer-badge { background: #e2e8f0; color: #475569; font-size: 12px; padding: 4px 8px; border-radius: 4px; text-align: center; margin: 6px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>雙軌雙向轉乘時刻查詢</h2>
  
  <div class="btn-group">
    <button id="btnOutbound" class="active" onclick="setDirection('outbound')">去程：台鐵➔高鐵</button>
    <button id="btnInbound" onclick="setDirection('inbound')">回程：高鐵➔台鐵</button>
  </div>

  <div class="input-group">
    <label for="timeInput">手動輸入出發時間（24小時制，例：18:08 或 1808）</label>
    <input type="text" id="timeInput" placeholder="請輸入時間，如 18:08" value="18:08">
  </div>

  <button class="query-btn" onclick="queryRoutes()">查詢最適轉乘班次</button>
</div>

<div id="results"></div>

<script>
// 台鐵：新竹➔六家 (順行) 官方最新時刻
const traHsinchuToLiujia = [
  { no: "1756", dep: "17:07", arr: "17:26" },
  { no: "1758", dep: "17:27", arr: "17:46" },
  { no: "1796", dep: "17:47", arr: "18:06" },
  { no: "1762", dep: "18:05", arr: "18:24" },
  { no: "1764", dep: "18:27", arr: "18:46" },
  { no: "1798", dep: "18:45", arr: "19:04" },
  { no: "1766", dep: "19:02", arr: "19:21" },
  { no: "1768", dep: "19:27", arr: "19:46" },
  { no: "1772", dep: "19:56", arr: "20:15" },
  { no: "1774", dep: "20:29", arr: "20:48" },
  { no: "1776", dep: "20:56", arr: "21:15" },
  { no: "1778", dep: "21:29", arr: "21:48" }
];

// 台鐵：六家➔新竹 (逆行) 官方最新時刻
const traLiujiaToHsinchu = [
  { no: "1753", dep: "17:05", arr: "17:24" },
  { no: "1755", dep: "17:32", arr: "17:51" },
  { no: "1757", dep: "18:05", arr: "18:24" },
  { no: "1761", dep: "18:32", arr: "18:51" },
  { no: "1763", dep: "19:05", arr: "19:24" },
  { no: "1765", dep: "19:32", arr: "19:51" },
  { no: "1767", dep: "20:02", arr: "20:21" },
  { no: "1771", dep: "20:32", arr: "20:51" },
  { no: "1773", dep: "21:05", arr: "21:24" },
  { no: "1775", dep: "21:32", arr: "21:51" },
  { no: "1777", dep: "22:02", arr: "22:21" }
];

// 高鐵：新竹➔台北
const hsrHsinchuToTaipei = [
  { no: "672", dep: "18:00", arr: "18:33" },
  { no: "1542", dep: "18:22", arr: "18:55" },
  { no: "678", dep: "18:48", arr: "19:21" },
  { no: "684", dep: "19:00", arr: "19:33" },
  { no: "1554", dep: "19:22", arr: "19:55" },
  { no: "690", dep: "19:48", arr: "20:21" },
  { no: "696", dep: "20:00", arr: "20:33" }
];

// 高鐵：台北➔新竹
const hsrTaipeiToHsinchu = [
  { no: "673", dep: "18:00", arr: "18:32" },
  { no: "1543", dep: "18:15", arr: "18:48" },
  { no: "679", dep: "18:35", arr: "19:08" },
  { no: "685", dep: "19:00", arr: "19:32" },
  { no: "1555", dep: "19:15", arr: "19:48" },
  { no: "691", dep: "19:30", arr: "20:02" },
  { no: "697", dep: "20:00", arr: "20:32" }
];

let currentDirection = 'outbound';

function setDirection(dir) {
  currentDirection = dir;
  document.getElementById('btnOutbound').className = dir === 'outbound' ? 'active' : '';
  document.getElementById('btnInbound').className = dir === 'inbound' ? 'active' : '';
  queryRoutes();
}

function parseTimeToMinutes(str) {
  if (!str) return null;
  let cleanStr = str.replace(/[^0-9]/g, '');
  if (cleanStr.length === 3) cleanStr = '0' + cleanStr;
  if (cleanStr.length === 4) {
    const h = parseInt(cleanStr.substring(0, 2), 10);
    const m = parseInt(cleanStr.substring(2, 4), 10);
    if (h >= 0 && h < 24 && m >= 0 && m < 60) return h * 60 + m;
  }
  return null;
}

function minToTimeString(mins) {
  const h = String(Math.floor(mins / 60)).padStart(2, '0');
  const m = String(mins % 60).padStart(2, '0');
  return `${h}:${m}`;
}

function queryRoutes() {
  const inputVal = document.getElementById('timeInput').value;
  const startMin = parseTimeToMinutes(inputVal);
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (startMin === null) {
    container.innerHTML = '<div style="color:red; text-align:center;">請輸入有效的時間格式（如 18:08 或 1808）</div>';
    return;
  }

  const results = [];
  const minTransferBuffer = 7; // 六家與高鐵站間預留最少 7 分鐘步行時間

  if (currentDirection === 'outbound') {
    // 去程：台鐵 (新竹➔六家) ➔ 高鐵 (新竹➔台北)
    const validTra = traHsinchuToLiujia.filter(t => parseTimeToMinutes(t.dep) >= startMin);
    
    validTra.forEach(tra => {
      const traArrMin = parseTimeToMinutes(tra.arr);
      const hsr = hsrHsinchuToTaipei.find(h => parseTimeToMinutes(h.dep) >= traArrMin + minTransferBuffer);
      if (hsr) {
        results.push({
          step1: { type: '台鐵', name: `區間車 ${tra.no} 次`, from: '新竹', to: '六家', dep: tra.dep, arr: tra.arr },
          buffer: parseTimeToMinutes(hsr.dep) - traArrMin,
          step2: { type: '高鐵', name: `高鐵 ${hsr.no} 次`, from: '高鐵新竹站', to: '台北', dep: hsr.dep, arr: hsr.arr }
        });
      }
    });
  } else {
    // 回程：高鐵 (台北➔新竹) ➔ 台鐵 (六家➔新竹)
    const validHsr = hsrTaipeiToHsinchu.filter(h => parseTimeToMinutes(h.dep) >= startMin);

    validHsr.forEach(hsr => {
      const hsrArrMin = parseTimeToMinutes(hsr.arr);
      const tra = traLiujiaToHsinchu.find(t => parseTimeToMinutes(t.dep) >= hsrArrMin + minTransferBuffer);
      if (tra) {
        results.push({
          step1: { type: '高鐵', name: `高鐵 ${hsr.no} 次`, from: '台北', to: '高鐵新竹站', dep: hsr.dep, arr: hsr.arr },
          buffer: parseTimeToMinutes(tra.dep) - hsrArrMin,
          step2: { type: '台鐵', name: `區間車 ${tra.no} 次`, from: '六家', to: '新竹', dep: tra.dep, arr: tra.arr }
        });
      }
    });
  }

  if (results.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">查無接續班次，請試著提前出發時間。</div>';
    return;
  }

  // 顯示前 4 組最佳方案
  results.slice(0, 4).forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div style="font-weight:bold; margin-bottom:8px; color:#333;">方案 ${idx + 1}</div>
      <div>
        <span class="tag ${r.step1.type === '台鐵' ? 'tag-tra' : 'tag-hsr'}">${r.step1.type}</span>
        <span class="train-info">${r.step1.name}</span>
        <div class="time-row">
          <span>${r.step1.from} <b>${r.step1.dep}</b></span>
          <span>➔</span>
          <span>${r.step1.to} <b>${r.step1.arr}</b></span>
        </div>
      </div>
      <div class="transfer-badge">步行轉乘時間：${r.buffer} 分鐘</div>
      <div>
        <span class="tag ${r.step2.type === '台鐵' ? 'tag-tra' : 'tag-hsr'}">${r.step2.type}</span>
        <span class="train-info">${r.step2.name}</span>
        <div class="time-row">
          <span>${r.step2.from} <b>${r.step2.dep}</b></span>
          <span>➔</span>
          <span>${r.step2.to} <b>${r.step2.arr}</b></span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 頁面載入後自動查詢一次
queryRoutes();
</script>

</body>
</html>
