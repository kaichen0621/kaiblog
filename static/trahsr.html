<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙鐵時刻表即時轉乘查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#0066ff',
            railBlue: '#004080',
            thsrOrange: '#f26522'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-3 md:p-6 transition-colors duration-200">

  <div class="max-w-md mx-auto space-y-3.5">
    
    <!-- 頂部時間與主題切換 -->
    <header class="flex justify-between items-center px-1">
      <div class="flex items-center gap-2">
        <span class="text-xl">🚆</span>
        <h1 class="text-base font-bold tracking-tight text-slate-800 dark:text-slate-100">雙鐵即時轉乘時刻</h1>
      </div>
      <div class="flex items-center gap-2">
        <div id="clockDisplay" class="text-xs font-mono font-bold bg-slate-200 dark:bg-slate-800 px-2.5 py-1 rounded-full text-slate-700 dark:text-slate-300">00:00:00</div>
        <button id="btnThemeToggle" class="p-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full text-xs shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700">
          🌓
        </button>
      </div>
    </header>

    <!-- 去程 / 回程（站點自動對調） -->
    <div class="bg-slate-200 dark:bg-slate-800 p-1 rounded-2xl grid grid-cols-2 gap-1 text-xs font-bold">
      <button id="btnDirOut" class="py-2 rounded-xl bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white transition">
        去程 (順向)
      </button>
      <button id="btnDirIn" class="py-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
        回程 (起終點自動對調)
      </button>
    </div>

    <!-- 頂部倒數計時黑底卡片 (轉乘黃金鏈) -->
    <div class="bg-slate-900 dark:bg-black text-white p-4 rounded-3xl shadow-xl space-y-2.5 relative overflow-hidden border border-slate-800">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <span class="text-[11px] text-amber-400 font-bold tracking-wider flex items-center gap-1">
          <span>⚡</span> 無縫轉乘最佳銜接方案
        </span>
        <span id="transferBadge" class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-medium">黃金 6~15 分鐘</span>
      </div>
      
      <!-- 台鐵車次 -->
      <div class="flex justify-between items-center border-b border-slate-800/60 pb-2">
        <div>
          <div class="text-[11px] text-slate-400">🚃 台鐵 (<span id="widgetTraRoute">--</span>)</div>
          <div id="widgetTraTime" class="text-base font-bold font-mono mt-0.5 text-blue-300">--:-- ~ --:--</div>
          <div id="widgetTraCode" class="text-[10px] text-slate-500">--</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400">起點發車倒數</div>
          <div class="text-xs font-bold font-mono text-blue-400"><span id="widgetTraCountdown" class="text-base">--</span> 分</div>
        </div>
      </div>

      <!-- 高鐵銜接車次 -->
      <div class="flex justify-between items-center pt-0.5">
        <div>
          <div class="text-[11px] text-slate-400">🚅 銜接高鐵 (<span id="widgetThsrRoute">--</span>)</div>
          <div id="widgetThsrTime" class="text-base font-bold font-mono mt-0.5 text-amber-300">--:-- ~ --:--</div>
          <div id="widgetThsrCode" class="text-[10px] text-slate-500">--</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400">轉乘等待時間</div>
          <div class="text-xs font-bold font-mono text-emerald-400"><span id="widgetTransferWait" class="text-base">--</span> 分</div>
        </div>
      </div>
    </div>

    <!-- 站點與時間選擇器卡片 -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-3.5 shadow-sm border border-slate-200 dark:border-slate-700 text-xs space-y-3">
      
      <!-- 站點選單 -->
      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <label class="block font-bold text-slate-600 dark:text-slate-300">台鐵 起點 → 終點</label>
          <div class="flex gap-1">
            <select id="traStart" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded-lg border dark:border-slate-600 font-medium"></select>
            <select id="traEnd" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded-lg border dark:border-slate-600 font-medium"></select>
          </div>
        </div>
        <div class="space-y-1">
          <label class="block font-bold text-slate-600 dark:text-slate-300">高鐵 起點 → 終點</label>
          <div class="flex gap-1">
            <select id="thsrStart" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded-lg border dark:border-slate-600 font-medium"></select>
            <select id="thsrEnd" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded-lg border dark:border-slate-600 font-medium"></select>
          </div>
        </div>
      </div>

      <!-- 時間設定列：含顯眼確定按鈕與快捷鈕 -->
      <div class="border-t dark:border-slate-700 pt-2.5 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span class="font-bold text-slate-600 dark:text-slate-300 whitespace-nowrap">查詢時間：</span>
          <div class="flex items-center gap-1.5 flex-1">
            <input type="time" id="searchTime" class="bg-slate-100 dark:bg-slate-700 p-2 rounded-xl border dark:border-slate-600 text-sm font-mono font-bold w-full text-center focus:ring-2 focus:ring-blue-500 outline-none">
            <!-- 顯眼的套用確定按鈕 (解決無確定鈕問題) -->
            <button id="btnApplyTime" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold px-3.5 py-2 rounded-xl whitespace-nowrap shadow-sm transition flex items-center gap-1">
              <span>✓</span> 套用確定
            </button>
          </div>
        </div>

        <!-- 快捷時間按鈕列 -->
        <div class="flex items-center justify-between gap-1 pt-1">
          <button id="btnSetNow" class="flex-1 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-bold py-1.5 rounded-lg hover:bg-emerald-200 text-[11px] transition">現在</button>
          <button id="btnSub15" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium py-1.5 rounded-lg hover:bg-slate-200 text-[11px] transition">-15分</button>
          <button id="btnAdd15" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium py-1.5 rounded-lg hover:bg-slate-200 text-[11px] transition">+15分</button>
          <button id="btnAdd30" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium py-1.5 rounded-lg hover:bg-slate-200 text-[11px] transition">+30分</button>
          <button id="btnAdd60" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium py-1.5 rounded-lg hover:bg-slate-200 text-[11px] transition">+1小時</button>
        </div>
      </div>
    </div>

    <!-- 雙欄班次時刻表 -->
    <main class="grid grid-cols-2 gap-2.5">
      <!-- 台鐵欄位 -->
      <div class="bg-white dark:bg-slate-800 p-2.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between border-b pb-2 dark:border-slate-700">
          <span class="truncate">🚃 <span id="traHeaderLabel">新竹 → 六家</span></span>
        </div>
        <div id="traTimeList" class="space-y-1.5 min-h-[380px]"></div>
      </div>

      <!-- 高鐵欄位 -->
      <div class="bg-white dark:bg-slate-800 p-2.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between border-b pb-2 dark:border-slate-700">
          <span class="truncate">🚅 <span id="thsrHeaderLabel">新竹 → 台北</span></span>
        </div>
        <div id="thsrTimeList" class="space-y-1.5 min-h-[380px]"></div>
      </div>
    </main>

    <!-- 分頁控制 -->
    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs">
      <button id="btnPrevPage" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold px-3 py-1.5 rounded-xl disabled:opacity-30 transition">
        ← 前 7 班
      </button>
      <span id="pageTracker" class="font-mono text-slate-400 text-[11px]">目前頁次</span>
      <button id="btnNextPage" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold px-3 py-1.5 rounded-xl disabled:opacity-30 transition">
        後 7 班 →
      </button>
    </div>

    <!-- Toast 提示訊息 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-50">
      已更新時刻表
    </div>

  </div>

      document.getElementById("widgetThsrRoute").innerText = `${thsrSName} → ${thsrEName}`;

      // 查詢台鐵真實車次
      traDisplayList = queryTRATimetable(traSId, traEId);

      // 查詢高鐵真實車次
      thsrDisplayList = queryTHSRTimetable(thsrSId, thsrEId);

      renderUI();

    function queryTRATimetable(sId, eId) {
      if (sId === eId) return [];
      const result = [];
      TRA_DATABASE.forEach(item => {
        if (item.stops[sId] && item.stops[eId]) {
          const depM = timeToMin(item.stops[sId]);
          const arrM = timeToMin(item.stops[eId]);
          if (arrM > depM) { // 確定行駛方向正確
            result.push({
              code: item.code,
              dep: item.stops[sId],
              arr: item.stops[eId]
            });
          }
        }
      });
      return result;
    }

    function queryTHSRTimetable(sId, eId) {
      if (sId === eId) return [];
      // 判定北上或南下
      const sIndex = THSR_STATIONS.findIndex(s => s.id === sId);
      const eIndex = THSR_STATIONS.findIndex(s => s.id === eId);
      const isNorthbound = (eIndex < sIndex);

      const baseList = isNorthbound ? THSR_NORTHBOUND : THSR_SOUTHBOUND;
      
      // 計算大致行駛時間 offset
      const durationMap = {
        "0990": 42, "1000": 32, "1010": 25, "1020": 12, "1030": 0,
        "1040": 11, "1050": 25, "1060": 35, "1070": 45, "1080": 58, "1090": 75, "1100": 83
      };
      
      const travelMins = Math.abs((durationMap[eId] || 30) - (durationMap[sId] || 0)) || 30;

      return baseList.map(item => {
        const depM = timeToMin(item.dep);
        const arrM = depM + travelMins;
        return {
          code: item.code,
          dep: item.dep,
          arr: minToTime(arrM)
        };
      });
    }

    function renderUI() {
      const targetTime = document.getElementById("searchTime").value || "08:00";
      const nowMin = timeToMin(targetTime);

      // 找到台鐵在查詢時間後的第一班車 (NEXT)
      let traIdx = traDisplayList.findIndex(item => timeToMin(item.dep) >= nowMin);
      if (traIdx === -1) traIdx = Math.max(0, traDisplayList.length - 7);

      const currentTra = traDisplayList[traIdx] || traDisplayList[0];
      const traArrivalMin = currentTra ? timeToMin(currentTra.arr) : nowMin;

      // 轉乘銜接黃金鏈：找出台鐵抵達後 6 ~ 15 分鐘（最高不超過20分）的最佳高鐵班次
      let thsrIdx = thsrDisplayList.findIndex(item => {
        const dep = timeToMin(item.dep);
        return dep >= (traArrivalMin + 6);
      });
      if (thsrIdx === -1) {
        thsrIdx = thsrDisplayList.findIndex(item => timeToMin(item.dep) >= traArrivalMin);
      }
      if (thsrIdx === -1) thsrIdx = Math.max(0, thsrDisplayList.length - 7);

      // 分頁處理
      const displayTraIdx = Math.max(0, Math.min(Math.max(0, traDisplayList.length - 7), traIdx + (pageOffset * 7)));
      const displayThsrIdx = Math.max(0, Math.min(Math.max(0, thsrDisplayList.length - 7), thsrIdx + (pageOffset * 7)));

      // 渲染列表 (明確顯示 起點發車 ~ 終點抵達)
      renderColumn("traTimeList", traDisplayList.slice(displayTraIdx, displayTraIdx + 7), traIdx, displayTraIdx);
      renderColumn("thsrTimeList", thsrDisplayList.slice(displayThsrIdx, displayThsrIdx + 7), thsrIdx, displayThsrIdx);

      // 更新頂部轉乘黑卡
      updateWidgetCard(targetTime, currentTra, thsrDisplayList[thsrIdx]);

      // 分頁按鈕狀態
      document.getElementById("btnPrevPage").disabled = (displayTraIdx === 0 && displayThsrIdx === 0);
      document.getElementById("btnNextPage").disabled = (displayTraIdx + 7 >= traDisplayList.length && displayThsrIdx + 7 >= thsrDisplayList.length);
      document.getElementById("pageTracker").innerText = `頁面位移: ${pageOffset >= 0 ? '+' + pageOffset : pageOffset}`;
    }

    function renderColumn(elementId, items, nextIndex, startIndex) {
      const container = document.getElementById(elementId);
      container.innerHTML = "";

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-12 text-xs">無相對應班次</div>`;
        return;
      }

      items.forEach((item, i) => {
        const actualIdx = startIndex + i;
        const isNext = (actualIdx === nextIndex);
        const card = document.createElement("div");

        if (isNext) {
          // 下一班 (NEXT) 藍色醒目膠囊
          card.className = "bg-blue-600 text-white font-bold py-2 px-2.5 rounded-2xl shadow-md shadow-blue-500/20";
          card.innerHTML = `
            <div class="flex justify-between items-center mb-0.5">
              <span class="text-[10px] bg-white/20 text-white px-1.5 py-0.2 rounded-full font-sans font-extrabold">NEXT</span>
              <span class="text-[10px] text-blue-100 font-mono">${item.code}</span>
            </div>
            <div class="text-sm font-mono text-center tracking-tight font-extrabold">${item.dep} ~ ${item.arr}</div>
          `;
        } else {
          // 一般車次 灰色膠囊
          card.className = "bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 font-bold py-2.5 px-2.5 rounded-2xl text-center hover:bg-slate-200 dark:hover:bg-slate-700 transition";
          card.innerHTML = `
            <div class="text-xs font-mono text-slate-400 dark:text-slate-400 mb-0.5">${item.code}</div>
            <div class="text-xs font-mono tracking-tight font-extrabold">${item.dep} ~ ${item.arr}</div>
          `;
        }
        container.appendChild(card);
      });
    }

    function updateWidgetCard(nowTimeStr, traItem, thsrItem) {
      const nowMin = timeToMin(nowTimeStr);

      if (traItem) {
        document.getElementById("widgetTraTime").innerText = `${traItem.dep} ~ ${traItem.arr}`;
        document.getElementById("widgetTraCode").innerText = traItem.code;
        const traCount = timeToMin(traItem.dep) - nowMin;
        document.getElementById("widgetTraCountdown").innerText = traCount >= 0 ? traCount : 0;
      } else {
        document.getElementById("widgetTraTime").innerText = "--:-- ~ --:--";
        document.getElementById("widgetTraCode").innerText = "--";
        document.getElementById("widgetTraCountdown").innerText = "--";
      }

      if (traItem && thsrItem) {
        document.getElementById("widgetThsrTime").innerText = `${thsrItem.dep} ~ ${thsrItem.arr}`;
        document.getElementById("widgetThsrCode").innerText = thsrItem.code;
        const waitTime = timeToMin(thsrItem.dep) - timeToMin(traItem.arr);
        document.getElementById("widgetTransferWait").innerText = waitTime >= 0 ? waitTime : 0;
        
        // 轉乘品質提示標籤
        const badge = document.getElementById("transferBadge");
        if (waitTime >= 6 && waitTime <= 15) {
          badge.className = "text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-medium";
          badge.innerText = "黃金 6~15 分鐘";
        } else if (waitTime > 15) {
          badge.className = "text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-medium";
          badge.innerText = `等候較長 (${waitTime}分)`;
        } else {
          badge.className = "text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-full font-medium";
          badge.innerText = "轉乘時間較緊";
        }
      } else {
        document.getElementById("widgetThsrTime").innerText = "--:-- ~ --:--";
        document.getElementById("widgetThsrCode").innerText = "--";
        document.getElementById("widgetTransferWait").innerText = "--";
      }
    }

    function getStationName(list, id) {
      const found = list.find(s => s.id === id);
      return found ? found.name : "";
    }

    function timeToMin(tStr) {
      if (!tStr) return 0;
      const [h, m] = tStr.split(":").map(Number);
      return (h * 60 + m) % 1440;
    }

    function minToTime(min) {
      const h = String(Math.floor((min % 1440) / 60)).padStart(2, '0');
      const m = String(min % 60).padStart(2, '0');
      return `${h}:${m}`;
    }
  </script>
