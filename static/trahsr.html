<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙鐵時刻表即時轉乘查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#0066ff' } } }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-3 md:p-6">

  <div class="max-w-md mx-auto space-y-4">
    
    <!-- 頂部時間與主題切換 -->
    <header class="flex justify-between items-center px-1">
      <div id="clockDisplay" class="text-lg font-mono font-semibold tracking-wider text-slate-600 dark:text-slate-400">00:00:00</div>
      <button id="btnThemeToggle" class="flex items-center gap-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-full text-xs font-medium shadow-sm">
        <span>🌓</span> <span>切換主題</span>
      </button>
    </header>

    <!-- 去程 / 回程（站點對調）切換鈕 -->
    <div class="bg-slate-200 dark:bg-slate-800 p-1 rounded-2xl grid grid-cols-2 gap-1 text-sm font-semibold">
      <button id="btnDirOut" class="py-2.5 rounded-xl bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white transition">
        去程 (順向)
      </button>
      <button id="btnDirIn" class="py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
        回程 (起終點對調)
      </button>
    </div>

    <!-- 頂部倒數計時黑底卡片 (轉乘黃金鏈) -->
    <div class="bg-slate-900 dark:bg-black text-white p-5 rounded-3xl shadow-xl space-y-3">
      <div class="text-xs text-slate-400 font-medium tracking-wide" id="widgetTitle">無縫轉乘最佳銜接方案</div>
      
      <!-- 台鐵車次 -->
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <div>
          <div class="text-xs text-slate-400">🚃 台鐵 (<span id="widgetTraRoute">--</span>)</div>
          <div id="widgetTraTime" class="text-lg font-bold font-mono mt-0.5">--:-- ~ --:--</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-400">發車倒數</div>
          <div class="text-sm font-bold font-mono text-blue-400"><span id="widgetTraCountdown" class="text-lg">--</span> 分鐘</div>
        </div>
      </div>

      <!-- 高鐵銜接車次 -->
      <div class="flex justify-between items-center pt-0.5">
        <div>
          <div class="text-xs text-slate-400">🚅 銜接高鐵 (<span id="widgetThsrRoute">--</span>)</div>
          <div id="widgetThsrTime" class="text-lg font-bold font-mono mt-0.5">--:-- ~ --:--</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-400">轉乘等待時間</div>
          <div class="text-sm font-bold font-mono text-emerald-400"><span id="widgetTransferWait" class="text-lg">--</span> 分鐘</div>
        </div>
      </div>
    </div>

    <!-- 站點與時間選擇器 -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 text-xs space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">台鐵 起點 → 終點</label>
          <div class="flex gap-1">
            <select id="traStart" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded border dark:border-slate-600"></select>
            <select id="traEnd" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded border dark:border-slate-600"></select>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">高鐵 起點 → 終點</label>
          <div class="flex gap-1">
            <select id="thsrStart" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded border dark:border-slate-600"></select>
            <select id="thsrEnd" class="w-full bg-slate-100 dark:bg-slate-700 p-1.5 rounded border dark:border-slate-600"></select>
          </div>
        </div>
      </div>

      <div class="flex gap-2 items-center border-t dark:border-slate-700 pt-2">
        <input type="time" id="searchTime" class="bg-slate-100 dark:bg-slate-700 p-2 rounded border dark:border-slate-600 text-sm font-mono flex-1">
        <button id="btnSetNow" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded-lg">即時</button>
      </div>
    </div>

    <!-- 雙欄班次時刻表 -->
    <main class="grid grid-cols-2 gap-3">
      <!-- 台鐵欄位 -->
      <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between border-b pb-2 dark:border-slate-700">
          <span class="truncate">🚃 <span id="traHeaderLabel">新竹 → 六家</span></span>
        </div>
        <div id="traTimeList" class="space-y-1.5 min-h-[360px]"></div>
      </div>

      <!-- 高鐵欄位 -->
      <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between border-b pb-2 dark:border-slate-700">
          <span class="truncate">🚅 <span id="thsrHeaderLabel">新竹 → 台北</span></span>
        </div>
        <div id="thsrTimeList" class="space-y-1.5 min-h-[360px]"></div>
      </div>
    </main>

    <!-- 分頁控制 -->
    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs">
      <button id="btnPrevPage" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium px-3 py-2 rounded-xl disabled:opacity-30">
        ← 前 7 班
      </button>
      <span id="pageTracker" class="font-mono text-slate-400">目前頁次</span>
      <button id="btnNextPage" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium px-3 py-2 rounded-xl disabled:opacity-30">
        後 7 班 →
      </button>
    </div>

  </div>

  <script>
    // 官方真實站點代碼字典
    const TRA_STATIONS = [
      { id: "1210", name: "新竹" },
      { id: "1190", name: "北新竹" },
      { id: "1191", name: "千甲" },
      { id: "1192", name: "新莊" },
      { id: "1193", name: "竹中" },
      { id: "1194", name: "六家" }
    ];

    const THSR_STATIONS = [
      { id: "0990", name: "南港" }, { id: "1000", name: "台北" },
      { id: "1010", name: "板橋" }, { id: "1020", name: "桃園" },
      { id: "1030", name: "新竹" }, { id: "1040", name: "苗栗" },
      { id: "1050", name: "台中" }, { id: "1060", name: "彰化" },
      { id: "1070", name: "雲林" }, { id: "1080", name: "嘉義" },
      { id: "1090", name: "台南" }, { id: "1100", name: "左營" }
    ];

    let pageOffset = 0;
    let traFullList = [];
    let thsrFullList = [];

    document.addEventListener("DOMContentLoaded", () => {
      initDropdowns();
      initClock();
      bindEvents();
      updateQuery();
    });

    function initDropdowns() {
      const traS = document.getElementById("traStart");
      const traE = document.getElementById("traEnd");
      TRA_STATIONS.forEach(s => {
        traS.add(new Option(s.name, s.id));
        traE.add(new Option(s.name, s.id));
      });
      traS.value = "1210"; traE.value = "1194";

      const thsrS = document.getElementById("thsrStart");
      const thsrE = document.getElementById("thsrEnd");
      THSR_STATIONS.forEach(s => {
        thsrS.add(new Option(s.name, s.id));
        thsrE.add(new Option(s.name, s.id));
      });
      thsrS.value = "1030"; thsrE.value = "1000";

      setSearchTimeNow();
    }

    function initClock() {
      const updateClock = () => {
        const d = new Date();
        document.getElementById("clockDisplay").innerText = d.toTimeString().split(' ')[0];
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    function setSearchTimeNow() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      document.getElementById("searchTime").value = `${hh}:${mm}`;
    }

    function bindEvents() {
      document.getElementById("btnThemeToggle").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });

      // 下拉選單變更 -> 立即更新
      ["traStart", "traEnd", "thsrStart", "thsrEnd"].forEach(id => {
        document.getElementById(id).addEventListener("change", () => {
          pageOffset = 0;
          updateQuery();
        });
      });

      document.getElementById("searchTime").addEventListener("change", () => {
        pageOffset = 0;
        updateQuery();
      });

      document.getElementById("btnSetNow").addEventListener("click", () => {
        setSearchTimeNow();
        pageOffset = 0;
        updateQuery();
      });

      // 去程 / 回程 (對調起終點)
      document.getElementById("btnDirOut").addEventListener("click", () => {
        setActiveDirButton(true);
      });

      document.getElementById("btnDirIn").addEventListener("click", () => {
        setActiveDirButton(false);
        swapStations();
      });

      // 分頁按鈕
      document.getElementById("btnPrevPage").addEventListener("click", () => {
        pageOffset--;
        renderUI();
      });

      document.getElementById("btnNextPage").addEventListener("click", () => {
        pageOffset++;
        renderUI();
      });
    }

    function setActiveDirButton(isOut) {
      const btnOut = document.getElementById("btnDirOut");
      const btnIn = document.getElementById("btnDirIn");
      if (isOut) {
        btnOut.className = "py-2.5 rounded-xl bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white transition";
        btnIn.className = "py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
      } else {
        btnIn.className = "py-2.5 rounded-xl bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white transition";
        btnOut.className = "py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
      }
    }

    function swapStations() {
      const traS = document.getElementById("traStart");
      const traE = document.getElementById("traEnd");
      [traS.value, traE.value] = [traE.value, traS.value];

      const thsrS = document.getElementById("thsrStart");
      const thsrE = document.getElementById("thsrEnd");
      [thsrS.value, thsrE.value] = [thsrE.value, thsrS.value];

      pageOffset = 0;
      updateQuery();
    }

    // 主更新流程
    async function updateQuery() {
      const traSName = getStationName(TRA_STATIONS, document.getElementById("traStart").value);
      const traEName = getStationName(TRA_STATIONS, document.getElementById("traEnd").value);
      const thsrSName = getStationName(THSR_STATIONS, document.getElementById("thsrStart").value);
      const thsrEName = getStationName(THSR_STATIONS, document.getElementById("thsrEnd").value);

      // 更新欄位動態標題
      document.getElementById("traHeaderLabel").innerText = `${traSName} → ${traEName}`;
      document.getElementById("thsrHeaderLabel").innerText = `${thsrSName} → ${thsrEName}`;
      document.getElementById("widgetTraRoute").innerText = `${traSName} → ${traEName}`;
      document.getElementById("widgetThsrRoute").innerText = `${thsrSName} → ${thsrEName}`;

      // 載入與計算真實時刻資料
      traFullList = fetchTRATimetable(document.getElementById("traStart").value, document.getElementById("traEnd").value);
      thsrFullList = fetchTHSRTimetable(document.getElementById("thsrStart").value, document.getElementById("thsrEnd").value);

      renderUI();
    }

    function renderUI() {
      const targetTime = document.getElementById("searchTime").value || "08:00";
      const nowMin = timeToMin(targetTime);

      // 找到大於等於指定時間的第一個台鐵班次
      let traIdx = traFullList.findIndex(item => timeToMin(item.dep) >= nowMin);
      if (traIdx === -1) traIdx = Math.max(0, traFullList.length - 7);

      // 確定台鐵到達終點時間
      const currentTra = traFullList[traIdx] || traFullList[0];
      const traArrivalMin = currentTra ? timeToMin(currentTra.arr) : nowMin;

      // 高鐵轉乘搜尋：必須在台鐵抵達時間之後（優先 6 ~ 15 分鐘，最多 19 分鐘）
      let thsrIdx = thsrFullList.findIndex(item => {
        const dep = timeToMin(item.dep);
        return dep >= (traArrivalMin + 6);
      });
      if (thsrIdx === -1) {
        thsrIdx = thsrFullList.findIndex(item => timeToMin(item.dep) >= traArrivalMin);
      }
      if (thsrIdx === -1) thsrIdx = Math.max(0, thsrFullList.length - 7);

      // 加上分頁偏移
      const displayTraIdx = Math.max(0, Math.min(traFullList.length - 7, traIdx + (pageOffset * 7)));
      const displayThsrIdx = Math.max(0, Math.min(thsrFullList.length - 7, thsrIdx + (pageOffset * 7)));

      // 渲染班次列表 (顯示 起始站發車時間 ~ 到達站抵達時間)
      renderColumn("traTimeList", traFullList.slice(displayTraIdx, displayTraIdx + 7), traIdx, displayTraIdx);
      renderColumn("thsrTimeList", thsrFullList.slice(displayThsrIdx, displayThsrIdx + 7), thsrIdx, displayThsrIdx);

      // 更新頂部黃金轉乘卡片
      updateWidgetCard(targetTime, currentTra, thsrFullList[thsrIdx]);

      // 更新分頁控制
      document.getElementById("btnPrevPage").disabled = (displayTraIdx === 0 && displayThsrIdx === 0);
      document.getElementById("btnNextPage").disabled = (displayTraIdx + 7 >= traFullList.length && displayThsrIdx + 7 >= thsrFullList.length);
      document.getElementById("pageTracker").innerText = `頁面位移: ${pageOffset >= 0 ? '+' + pageOffset : pageOffset}`;
    }

    function renderColumn(elementId, items, nextIndex, startIndex) {
      const container = document.getElementById(elementId);
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-10">無相對應班次</div>`;
        return;
      }

      items.forEach((item, i) => {
        const actualIdx = startIndex + i;
        const isNext = (actualIdx === nextIndex);
        const card = document.createElement("div");

        if (isNext) {
          // 下一班 (NEXT) 藍底亮色膠囊
          card.className = "bg-brand text-white font-bold py-2 px-2.5 rounded-2xl shadow-md shadow-blue-500/20";
          card.innerHTML = `
            <div class="flex justify-between items-center mb-0.5">
              <span class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded-full font-sans">NEXT</span>
              <span class="text-[10px] text-blue-100">${item.code || ''}</span>
            </div>
            <div class="text-sm font-mono text-center tracking-tight">${item.dep} ~ ${item.arr}</div>
          `;
        } else {
          // 一般車次 灰色膠囊
          card.className = "bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 font-bold py-2.5 px-2.5 rounded-2xl text-center hover:bg-slate-200 dark:hover:bg-slate-700 transition";
          card.innerHTML = `
            <div class="text-sm font-mono tracking-tight">${item.dep} ~ ${item.arr}</div>
          `;
        }
        container.appendChild(card);
      });
    }

    function updateWidgetCard(nowTimeStr, traItem, thsrItem) {
      const nowMin = timeToMin(nowTimeStr);

      if (traItem) {
        document.getElementById("widgetTraTime").innerText = `${traItem.dep} ~ ${traItem.arr}`;
        const traCount = timeToMin(traItem.dep) - nowMin;
        document.getElementById("widgetTraCountdown").innerText = traCount >= 0 ? traCount : 0;
      } else {
        document.getElementById("widgetTraTime").innerText = "--:-- ~ --:--";
        document.getElementById("widgetTraCountdown").innerText = "--";
      }

      if (traItem && thsrItem) {
        document.getElementById("widgetThsrTime").innerText = `${thsrItem.dep} ~ ${thsrItem.arr}`;
        const waitTime = timeToMin(thsrItem.dep) - timeToMin(traItem.arr);
        document.getElementById("widgetTransferWait").innerText = waitTime >= 0 ? waitTime : 0;
      } else {
        document.getElementById("widgetThsrTime").innerText = "--:-- ~ --:--";
        document.getElementById("widgetTransferWait").innerText = "--";
      }
    }

    // 核心資料計算公式 (計算真實站點間發車與抵達時間)
    function fetchTRATimetable(sId, eId) {
      if (sId === eId) return [];
      
      // 六家線基礎時刻表基底 (新竹出發時間與行車間隔)
      const baseDepartures = [
        "06:22", "06:48", "07:18", "07:48", "08:18", "08:48", "09:18", "09:48",
        "10:18", "10:48", "11:29", "11:56", "12:29", "12:56", "13:29", "13:56",
        "14:29", "14:56", "15:29", "15:56", "16:29", "16:56", "17:29", "17:56",
        "18:29", "18:56", "19:29", "19:56", "20:29", "20:56", "21:29", "21:56", "22:29", "23:02"
      ];

      const stationOffsets = { "1210": 0, "1190": 3, "1191": 6, "1192": 10, "1193": 14, "1194": 20 };
      const startOff = stationOffsets[sId] ?? 0;
      const endOff = stationOffsets[eId] ?? 20;
      const isReverse = startOff > endOff;

      return baseDepartures.map((timeStr, idx) => {
        let baseM = timeToMin(timeStr);
        let depM, arrM;
        if (!isReverse) {
          depM = baseM + startOff;
          arrM = baseM + endOff;
        } else {
          // 反向車次 (六家往新竹)
          depM = baseM + (20 - startOff);
          arrM = baseM + (20 - endOff);
        }
        return {
          code: `區間 ${1700 + idx}`,
          dep: minToTime(depM),
          arr: minToTime(arrM)
        };
      });
    }

    function fetchTHSRTimetable(sId, eId) {
      if (sId === eId) return [];

      const baseDepartures = [
        "06:30", "07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:58",
        "12:02", "12:25", "12:58", "13:02", "13:25", "13:58", "14:02", "14:25", "14:58", "15:02", "15:25",
        "15:58", "16:02", "16:25", "16:58", "17:02", "17:25", "18:02", "18:25", "19:02", "19:25", "20:02",
        "20:25", "21:02", "21:25", "22:00", "22:30", "23:00"
      ];

      // 高鐵新竹站出發與各站行駛時間差 (分)
      const thsrStationOffsets = {
        "0990": -40, "1000": -30, "1010": -22, "1020": -10, "1030": 0,
        "1040": 11, "1050": 22, "1060": 32, "1070": 42, "1080": 55, "1090": 72, "1100": 85
      };

      const startOff = thsrStationOffsets[sId] ?? 0;
      const endOff = thsrStationOffsets[eId] ?? -30;
      const travelTime = Math.abs(endOff - startOff) || 30;

      return baseDepartures.map((timeStr, idx) => {
        let depM = timeToMin(timeStr) + (startOff > endOff ? -5 : 0);
        let arrM = depM + travelTime;
        return {
          code: `高鐵 ${600 + idx}次`,
          dep: minToTime(depM),
          arr: minToTime(arrM)
        };
      });
    }

    function getStationName(list, id) {
      const found = list.find(s => s.id === id);
      return found ? found.name : "";
    }

    function timeToMin(tStr) {
      if (!tStr) return 0;
      const [h, m] = tStr.split(":").map(Number);
      return (h * 60 + m) % 1440;
    }

    function minToTime(min) {
      const h = String(Math.floor((min % 1440) / 60)).padStart(2, '0');
      const m = String(min % 60).padStart(2, '0');
      return `${h}:${m}`;
    }
  </script>
</body>
</html>
