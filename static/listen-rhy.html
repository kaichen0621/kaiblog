<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#429eee">
<title>Rhythm Forge v4</title>
<style>
:root{
--blue:#429eee;--blue2:#187bc6;--bg:#f3f8fc;--card:#fff;--ink:#18344d;
--muted:#71869a;--line:#dce8f1;--soft:#edf6fd;--ok:#148052;--bad:#b43b4a;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#edf7ff,#f8fbfd 55%,#f2f5f8);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans TC",sans-serif}
button,select,input{font:inherit}
button{border:0}
.app{max-width:1080px;margin:auto;padding:16px 14px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
h1{font-size:36px;letter-spacing:-1.5px;margin:0}.sub{margin:5px 0 0;color:var(--muted)}
.badge{background:var(--soft);color:var(--blue2);font-weight:800;border-radius:999px;padding:9px 12px;font-size:12px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 34px rgba(31,83,119,.07)}
.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr auto;gap:9px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--blue)}
.primary,.secondary{padding:11px 15px;border-radius:12px;font-weight:850;white-space:nowrap}
.primary{background:var(--blue);color:#fff}.secondary{background:#edf4f9;color:#315e7c}
.primary:disabled{opacity:.42}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}
.tab{flex:0 0 auto;background:#eef4f8;color:#61778a;border-radius:12px;padding:10px 14px;font-weight:750}
.tab.active{background:var(--blue);color:#fff}
.infoRow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 10px;background:#f3f7fa;border-radius:11px;font-size:13px}.chip b{color:var(--blue2)}
.play{font-size:16px;padding:13px 20px}
.progress{height:7px;background:#e5edf2;border-radius:99px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;width:0;background:var(--blue)}
.scoreTitle{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}.scoreTitle strong{font-size:17px}.hint{font-size:12px;color:var(--muted)}
.scoreBox{overflow-x:auto}.score{display:block;width:100%;min-width:900px;height:260px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
.work h2{font-size:20px;margin:0 0 5px}.desc{color:var(--muted);font-size:13px;line-height:1.65}
.modeRow{display:flex;gap:7px;align-items:center;margin:13px 0 7px;flex-wrap:wrap}
.modeBtn{background:#edf4f9;color:#587187;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}
.modeBtn.active{background:#dff0ff;color:var(--blue2)}
.grid{display:grid;gap:4px;margin-top:9px}
.slot{height:38px;border:1px solid #dce7ee;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:#6d8598;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.slot.single{background:#eaf5ff;border-color:#8cc9f6;color:#187bc6;font-weight:900}
.slot.double{background:#d9efff;border-color:#429eee;color:#126aa9;font-weight:900;letter-spacing:-3px}
.slot.given{background:#f3f6f8;color:#b4c1cb;cursor:not-allowed}
.barNames{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:#879aa9;text-align:center;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.feedback{margin-top:10px;padding:11px 12px;border-radius:12px;background:#f4f8fa;color:#5d7282;font-size:13px;line-height:1.6;min-height:45px}
.feedback.ok{background:#eaf8f1;color:var(--ok)}.feedback.bad{background:#fff0f2;color:var(--bad)}
.sideBox{background:#f5f9fb;border-radius:13px;padding:11px 12px;margin-top:8px}.sideBox b{font-size:21px;display:block}.sideBox small{color:var(--muted)}
.small{font-size:12px;color:var(--muted);line-height:1.7}
@media(max-width:850px){.controls{grid-template-columns:1fr 1fr 1fr}.work{grid-template-columns:1fr}}
@media(max-width:560px){.app{padding:12px 9px 40px}h1{font-size:30px}.badge{display:none}.controls{grid-template-columns:1fr 1fr}.controls>div:nth-child(3){grid-column:span 2}.controls button{grid-column:span 2}.card{padding:14px;border-radius:19px}.score{min-width:820px;height:240px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Rhythm Forge</h1><p class="sub">大學音樂術科・節奏聽寫特訓</p></div><div class="badge">v4 · 雙音強化</div></header>

<section class="card">
<div class="controls">
<div><label>模式</label><select id="mode"><option value="train">訓練・3 題</option><option value="exam">模擬・2 題</option></select></div>
<div><label>難度</label><select id="level"><option value="1">Lv.1 基礎</option><option value="2">Lv.2 八分</option><option value="3">Lv.3 附點／切分</option><option value="4" selected>Lv.4 進階</option><option value="5">Lv.5 強化</option></select></div>
<div><label>拍號</label><select id="meter"><option value="random">隨機 3/4・4/4・6/8</option><option>3/4</option><option>4/4</option><option>6/8</option></select></div>
<div><label>速度 <span id="bpmText">84</span> BPM</label><input id="bpm" type="range" min="50" max="150" value="84"></div>
<div><label>連結線</label><select id="beam"><option value="on">開啟</option><option value="off">關閉</option></select></div>
<button class="primary" id="new">新回合</button>
</div>
</section>

<section class="card">
<div class="tabs" id="tabs"></div>
<div class="infoRow">
<div class="chips">
<span class="chip">本回合 <b id="count">3</b> 題</span>
<span class="chip">播放 <b id="plays">0 / 4</b></span>
<span class="chip">連續正確 <b id="streak">0</b></span>
<span class="chip">弱點 <b id="weak">—</b></span>
</div>
<button class="primary play" id="listen">▶ 開始聽</button>
</div>
<div class="progress"><i id="progress"></i></div>
<div class="scoreTitle"><strong id="scoreHeading">第 1 題・6/8</strong><span class="hint">第一小節為已提供答案・第 2～4 小節作答</span></div>
<div class="scoreBox" id="scoreBox"></div>
</section>

<section class="work">
<section class="card">
<h2>節奏作答</h2>
<div class="desc">點擊格子循環：空白 → 單音 → <b>雙音</b> → 空白。雙音可以連續出現，不會被強迫做成輪流單／雙音。</div>
<div class="modeRow"><b style="font-size:13px">細分：</b><button class="modeBtn active" id="sixteenth">十六分</button><button class="modeBtn" id="triplet">三連音</button></div>
<div id="answer"></div>
<div class="barNames"><span>第 1 小節</span><span>第 2 小節</span><span>第 3 小節</span><span>第 4 小節</span></div>
<div class="actions"><button class="primary" id="check">✓ 批改</button><button class="secondary" id="clear">清除作答</button><button class="secondary" id="replay">↻ 再聽一次</button></div>
<div class="feedback" id="feedback">按「開始聽」播放；沒有預備拍。</div>
</section>
<aside class="card">
<h2 style="margin:0;font-size:19px">弱點雷達</h2>
<p class="small">答錯後自動記錄類型，之後高難度題會提高相關型態出現率。</p>
<div class="sideBox"><b id="e16">0</b><small>十六分／短值</small></div>
<div class="sideBox"><b id="edot">0</b><small>附點</small></div>
<div class="sideBox"><b id="esync">0</b><small>切分／跨拍</small></div>
<div class="sideBox"><b id="etrip">0</b><small>三連音</small></div>
<div class="sideBox"><b id="edouble">0</b><small>雙音／連續雙音</small></div>
</aside>
</section>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const TOTAL={"3/4":144,"4/4":192,"6/8":144};
const GROUPS={"3/4":[48,48,48],"4/4":[48,48,48,48],"6/8":[72,72]};
let audio=null, master=null, round=[],qi=0,plays=0,started=false,streak=0,gridMode="sixteenth";
let answer=[]; // events {t, voices}
let weak={sixteenth:0,dotted:0,sync:0,triplet:0,double:0};
let seen=new Set();

const POOL={
"3/4":[
[48,48,48],[96,48],[48,96],[24,24,48,48],[36,12,48,48],[24,72,24,24],
[12,12,24,36,12,48],[16,16,16,48,48],[24,12,12,24,24,24,24],[36,12,24,24,48]
],
"4/4":[
[48,48,48,48],[96,96],[48,96,48],[24,24,24,24,24,24,24,24],
[72,24,48,48],[24,48,24,48,48],[36,12,48,24,24,48],[24,72,24,24,48],
[12,12,24,36,12,24,24,48],[16,16,16,48,16,16,48,24],[24,12,12,24,12,36,24,48]
],
"6/8":[
[72,72],[48,24,72],[24,48,72],[24,24,24,24,24,24],[72,24,24,24],
[24,48,24,48],[36,36,36,36],[36,12,24,24,48],[24,48,24,24,24],
[12,12,24,36,12,48],[16,16,16,24,24,48],[24,12,12,36,24,24,12]
]};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function meter(){let m=$("meter").value;return m==="random"?pick(["3/4","4/4","6/8"]):m}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function valid(p,m){return p.reduce((a,b)=>a+b,0)===TOTAL[m]}
function typeOf(p){
 if(p.some(x=>x===16||x===12))return "sixteenth";
 if(p.some(x=>x===36||x===72))return "dotted";
 if(p.some((x,i)=>i>0&&x<=24))return "sync";
 return "simple";
}
function makeBars(m,l){
 let pool=POOL[m].filter(p=>valid(p,m));
 let candidates=pool.filter(p=>{
   if(l<=1)return !p.some(x=>x<24);
   if(l===2)return p.some(x=>x===24);
   if(l===3)return p.some(x=>x===36)||p.some(x=>x===24);
   return p.some(x=>x<=16)||p.some(x=>x===36);
 });
 if(!candidates.length)candidates=pool;
 let bars=[];
 for(let i=0;i<4;i++){
   let weighted=candidates;
   // Weakness weighting
   if(weak.sixteenth>0&&l>=4)weighted=weighted.concat(pool.filter(p=>p.some(x=>x<=16)));
   if(weak.dotted>0&&l>=3)weighted=weighted.concat(pool.filter(p=>p.some(x=>x===36||x===72)));
   bars.push([...pick(weighted)]);
 }
 return bars;
}
function addDoubleVoices(bars,m,l){
 const out=bars.map(p=>p.map(d=>({d,voices:1})));
 if(l<4)return out;
 // Multiple simultaneous double hits. Some questions deliberately contain consecutive doubles.
 let candidates=[];
 out.forEach((bar,bi)=>bar.forEach((e,i)=>{if(bi>0)candidates.push({bi,i})}));
 let probability=.28+(l-4)*.12;
 if(Math.random()<.85){
   let count=l===5?Math.floor(2+Math.random()*3):1+Math.floor(Math.random()*3);
   let chosen=shuffle(candidates).slice(0,count);
   chosen.forEach(x=>out[x.bi][x.i].voices=2);
   // About half the time make two adjacent double hits, specifically to defeat alternating-pattern guessing.
   if(l>=5 && Math.random()<.7){
     let bi=1+Math.floor(Math.random()*3),bar=out[bi];
     if(bar.length>=2){let i=Math.floor(Math.random()*(bar.length-1));bar[i].voices=2;bar[i+1].voices=2}
   }
 }
 return out;
}
function makeQ(){
 let m=meter(),l=+$("level").value,b=addDoubleVoices(makeBars(m,l),m,l);
 let key=m+"|"+b.map(x=>x.map(e=>e.d+"x"+e.voices).join(".")).join("/");
 return {m,b,key};
}
function newRound(){
 let n=$("mode").value==="exam"?2:3,local=new Set();round=[];
 let guard=0;
 while(round.length<n&&guard++<1000){
   let q=makeQ();if(!seen.has(q.key)&&!local.has(q.key)){local.add(q.key);round.push(q)}
 }
 while(round.length<n){let q=makeQ();if(!local.has(q.key)){local.add(q.key);round.push(q)}}
 seen=new Set([...seen,...local]);if(seen.size>1000)seen=new Set([...local]);
 qi=0;load();
}
function tabRender(){
 $("tabs").innerHTML="";
 round.forEach((q,i)=>{let b=document.createElement("button");b.className="tab"+(i===qi?" active":"");b.textContent=`第 ${i+1} 題　${q.m}`;
 b.onclick=()=>{qi=i;load()};$("tabs").appendChild(b)});
 $("count").textContent=round.length;
}
function load(){
 plays=0;started=false;answer=[];tabRender();
 let q=round[qi];$("plays").textContent="0 / 4";$("progress").style.width="0%";
 $("scoreHeading").textContent=`第 ${qi+1} 題・${q.m}`;
 $("listen").disabled=false;$("check").disabled=true;$("weak").textContent="—";
 $("feedback").className="feedback";$("feedback").textContent="第一小節已提供。按「開始聽」播放；沒有預備拍。";
 renderScore();renderAnswer();
}
function staffY(){return 113}
function svgEl(name,attrs){let e=document.createElementNS(NS,name);for(let k in attrs)e.setAttribute(k,attrs[k]);return e}
function line(svg,x1,y1,x2,y2,w=1){svg.appendChild(svgEl("line",{x1,y1,x2,y2,stroke:"#18344d","stroke-width":w}))}
function text(svg,x,y,s,size=12,weight=500,fill="#18344d",anchor="start"){let t=svgEl("text",{x,y,"font-size":size,"font-weight":weight,fill,"text-anchor":anchor});t.textContent=s;svg.appendChild(t)}
function note(svg,x,y,voices=1,empty=false){
 if(empty)return;
 if(voices===1){svg.appendChild(svgEl("ellipse",{cx:x,cy:y,rx:9,ry:6,fill:"#18344d",transform:`rotate(-18 ${x} ${y})`}));
 line(svg,x+8,y-2,x+8,y-48,2.4);
 }else{
   svg.appendChild(svgEl("ellipse",{cx:x-5,cy:y,rx:8,ry:5.7,fill:"#18344d",transform:`rotate(-18 ${x-5} ${y})`}));
   svg.appendChild(svgEl("ellipse",{cx:x+7,cy:y-8,rx:8,ry:5.7,fill:"#18344d",transform:`rotate(-18 ${x+7} ${y-8})`}));
   line(svg,x+14,y-10,x+14,y-55,2.4);line(svg,x-0,y-2,x,y-48,2.4);
 }
}
function beam(svg,x1,x2,y,thick=5){line(svg,x1,y,x2,y,thick)}
function drawEvents(svg,events,m,bx,bw,showEmpty=false){
 const total=TOTAL[m],base=staffY(),starts=[];let pos=0;
 events.forEach(e=>{starts.push({start:pos,d:e.d,voices:e.voices||1});pos+=e.d});
 starts.forEach(e=>{
   let x=bx+(e.start/total)*bw+11;
   if(e.voices===2)note(svg,x,base,e.voices);else note(svg,x,base,e.voices);
   if(e.d===36||e.d===72)svg.appendChild(svgEl("circle",{cx:x+15,cy:base-1,r:2.4,fill:"#18344d"}));
 });
 if($("beam").value==="on"){
   let groups=m==="6/8"?[72,72]:GROUPS[m];let gs=0;
   groups.forEach(g=>{
     let small=starts.filter(e=>e.start>=gs&&e.start<gs+g&&e.d<=24);
     if(small.length>=2){
       let xs=small.map(e=>bx+(e.start/total)*bw+18);
       beam(svg,xs[0],xs[xs.length-1],base-48);
       if(small.some(e=>e.d<=12))beam(svg,xs[0],xs[xs.length-1],base-41,4);
     }
     gs+=g;
   });
 }
 // triplet bracket
 let ts=starts.filter(e=>e.d===16);
 for(let i=0;i<ts.length;){
   let g=[ts[i]];let j=i+1;while(j<ts.length&&ts[j].start-ts[j-1].start===16&&g.length<3){g.push(ts[j]);j++}
   if(g.length===3){let x1=bx+(g[0].start/total)*bw+4,x2=bx+(g[2].start/total)*bw+25;line(svg,x1,70,x2,70,1.5);text(svg,(x1+x2)/2,68,"3",11,800,"#18344d","middle");i=j}else i++;
 }
}
function renderScore(){
 let q=round[qi],box=$("scoreBox");box.innerHTML="";
 let svg=svgEl("svg",{viewBox:"0 0 1040 260",class:"score"});
 let left=64,bw=240;
 text(svg,12,25,`${q.m}　·　第 ${qi+1} 題　·　${$("beam").value==="on"?"連結線開":"連結線關"}`,13,800,"#71869a");
 // clef and time signature
 text(svg,22,133,"𝄞",58,400,"#18344d");
 text(svg,47,101,q.m.split("/")[0],25,850,"#18344d","middle");text(svg,47,130,q.m.split("/")[1],25,850,"#18344d","middle");
 for(let b=0;b<4;b++){
   let bx=left+b*bw;
   for(let i=0;i<5;i++)line(svg,bx,staffY()-26+i*13,bx+bw,staffY()-26+i*13,1);
   line(svg,bx,87,bx,139,b===0?2:1.4);line(svg,bx+bw,87,bx+bw,139,b===3?2:1.4);
   if(b===0){
     drawEvents(svg,q.b[0],q.m,bx,bw);
     text(svg,bx+10,164,"① 已提供答案",12,800,"#187bc6");
   }else{
     let entered=answer.filter(e=>Math.floor(e.t/TOTAL[q.m])===b).map(e=>({d:e.d||24,voices:e.voices}));
     if(entered.length)drawUserBar(svg,entered,q.m,bx,bw);
     text(svg,bx+10,164,entered.length?`② 作答・${entered.length} 個起音`:"② 作答區",12,700,entered.length?"#187bc6":"#9aabb8");
   }
 }
 box.appendChild(svg);
}
function drawUserBar(svg,events,m,bx,bw){
 // events are durations generated from sorted starts
 drawEvents(svg,events,m,bx,bw);
}
function gridSlots(m,mode){
 if(mode==="triplet")return m==="6/8"?9:m==="3/4"?9:12;
 return m==="6/8"?12:m==="3/4"?12:16;
}
function slotTick(m,mode,i){
 let n=gridSlots(m,mode);return i*(TOTAL[m]/n);
}
function renderAnswer(){
 let q=round[qi],root=$("answer");root.innerHTML="";
 let totalSlots=gridSlots(q.m,gridMode),rows=[];
 for(let b=0;b<4;b++){
   let row=document.createElement("div");row.className="grid";row.style.gridTemplateColumns=`repeat(${totalSlots},1fr)`;
   for(let i=0;i<totalSlots;i++){
     let t=b*TOTAL[q.m]+slotTick(q.m,gridMode,i);
     let el=document.createElement("div");el.className="slot"+(b===0?" given":"");
     let hit=answer.find(e=>e.t===t);
     if(hit)el.classList.add(hit.voices===2?"double":"single");
     el.textContent=hit?(hit.voices===2?"●●":"●"):"";
     if(b>0){
       el.setAttribute("role","button");
       el.onclick=(ev)=>{ev.preventDefault();toggle(t,slotTick(q.m,gridMode,i));el.blur()};
     }
     row.appendChild(el);
   }
   root.appendChild(row);
 }
}
function toggle(t,d){
 if(!started)return;
 let idx=answer.findIndex(e=>e.t===t);
 if(idx<0)answer.push({t,voices:1,d});
 else if(answer[idx].voices===1)answer[idx].voices=2;
 else answer.splice(idx,1);
 answer.sort((a,b)=>a.t-b.t);
 renderAnswer();renderScore();
}
function initAudio(){
 if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();
   master=audio.createDynamicsCompressor();master.threshold.value=-18;master.knee.value=10;master.ratio.value=5;master.attack.value=.002;master.release.value=.08;
   let gain=audio.createGain();gain.gain.value=1.45;gain.connect(master);master.connect(audio.destination);audio._gain=gain;
 }
}
function hit(t,voice,accent){
 let o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();
 o.type=voice===1?"triangle":"square";o.frequency.setValueAtTime(voice===1?(accent?180:125):(accent?310:220),t);
 o.frequency.exponentialRampToValueAtTime(voice===1?55:85,t+.075);
 f.type="bandpass";f.frequency.value=voice===1?1200:1900;f.Q.value=1.1;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(accent?.32:.24,t+.002);
 g.gain.exponentialRampToValueAtTime(.0001,t+.11);
 o.connect(f).connect(g).connect(audio._gain);o.start(t);o.stop(t+.12);
 // Noise click makes the percussion much more audible on phone speakers.
 let buf=audio.createBuffer(1,audio.sampleRate*.045,audio.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3);
 let n=audio.createBufferSource(),ng=audio.createGain(),nf=audio.createBiquadFilter();n.buffer=buf;nf.type="highpass";nf.frequency.value=1100;
 ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(accent?.12:.08,t+.001);ng.gain.exponentialRampToValueAtTime(.0001,t+.045);
 n.connect(nf).connect(ng).connect(audio._gain);n.start(t);
}
async function listen(){
 if(plays>=4)return;
 initAudio();if(audio.state==="suspended")await audio.resume();
 let q=round[qi],bpm=+$("bpm").value,beat=60/bpm,start=audio.currentTime+.04;
 plays++;started=true;$("plays").textContent=`${plays} / 4`;$("progress").style.width=`${plays*25}%`;$("check").disabled=false;
 let t=0;
 q.b.forEach((bar,bi)=>{
   bar.forEach(e=>{
     let accent=(bi===0&&t===0)||(t%TOTAL[q.m]===0)||(q.m==="6/8"&&t%TOTAL[q.m]===72)||(q.m!=="6/8"&&t%48===0);
     for(let v=0;v<(e.voices||1);v++)hit(start+(t/48)*beat,v+1,accent);
     t+=e.d;
   });
 });
 $("feedback").className="feedback";$("feedback").textContent=`第 ${qi+1} 題・第 ${plays} 次。${q.m}，無預備拍。`;
}
function targetStarts(q){
 let out=[],abs=0;
 q.b.forEach(bar=>{bar.forEach(e=>{out.push({t:abs,d:e.d,voices:e.voices});abs+=e.d})});
 return out.filter(e=>e.t>=TOTAL[q.m]);
}
function check(){
 if(!started)return;
 let q=round[qi],tar=targetStarts(q),mine=answer.filter(e=>e.t>=TOTAL[q.m]);
 let miss=tar.filter(x=>!mine.some(y=>y.t===x.t)).length;
 let extra=mine.filter(x=>!tar.some(y=>y.t===x.t)).length;
 let doubleMiss=tar.filter(x=>x.voices===2).filter(x=>!mine.some(y=>y.t===x.t&&y.voices===2)).length;
 let doubleExtra=mine.filter(x=>x.voices===2).filter(x=>!tar.some(y=>y.t===x.t&&y.voices===2)).length;
 if(!miss&&!extra&&!doubleMiss&&!doubleExtra){
   streak++;$("streak").textContent=streak;$("feedback").className="feedback ok";$("feedback").textContent="✓ 全對。起音位置與雙音位置都命中。";return;
 }
 streak=0;$("streak").textContent=0;
 let type=diagnose(tar,mine);weak[type]++;updateWeak();$("weak").textContent=label(type);
 $("feedback").className="feedback bad";
 $("feedback").innerHTML=`✗ 起音：漏 ${miss}、多 ${extra}；雙音：漏 ${doubleMiss}、多 ${doubleExtra}。主要弱點：<b>${label(type)}</b>`;
}
function diagnose(tar,mine){
 if(tar.some(x=>x.voices===2)||mine.some(x=>x.voices===2))return"double";
 if(tar.some(x=>x.d===16||x.d===12))return"sixteenth";
 if(tar.some(x=>x.d===36||x.d===72))return"dotted";
 if(tar.some(x=>x.t%48!==0))return"sync";
 return"triplet";
}
function label(x){return({sixteenth:"十六分／短值",dotted:"附點",sync:"切分／跨拍",triplet:"三連音",double:"雙音／連續雙音"})[x]}
function updateWeak(){
 $("e16").textContent=weak.sixteenth;$("edot").textContent=weak.dotted;$("esync").textContent=weak.sync;$("etrip").textContent=weak.triplet;$("edouble").textContent=weak.double;
}
$("bpm").oninput=()=>$("bpmText").textContent=$("bpm").value;
$("beam").onchange=renderScore;$("new").onclick=newRound;$("listen").onclick=listen;$("replay").onclick=listen;$("check").onclick=check;
$("clear").onclick=()=>{answer=[];renderAnswer();renderScore()};
$("mode").onchange=newRound;$("level").onchange=newRound;$("meter").onchange=newRound;
$("sixteenth").onclick=()=>{gridMode="sixteenth";$("sixteenth").classList.add("active");$("triplet").classList.remove("active");renderAnswer()};
$("triplet").onclick=()=>{gridMode="triplet";$("triplet").classList.add("active");$("sixteenth").classList.remove("active");renderAnswer()};
newRound();
</script>
