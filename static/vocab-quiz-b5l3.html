<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>龍騰 B5 L3–L4 單字測驗</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh}main{max-width:780px;margin:auto;padding:16px}h1{font-size:clamp(25px,6vw,36px);margin:12px 0}p{line-height:1.6;color:#ddd}.panel{border:1px solid #333;border-radius:6px;padding:18px;margin:12px 0}button,select,input{font:inherit;border-radius:6px;padding:13px;color:white;background:#080808;border:1px solid #555}button{cursor:pointer;font-weight:700}button.primary{background:#429eee;border-color:#429eee;color:#000}button:disabled{opacity:.45}input{width:100%;font-size:20px;background:#050505;border-color:white}label{display:block;margin:12px 0 6px}#quiz{display:none}#canvas{display:block;width:100%;height:240px;background:#000}#feedback{display:none;padding:16px;border-radius:10px;background:#090909;border:2px solid white;margin-top:12px;font-size:19px;line-height:1.6}#feedback.good{background:#087c27}#feedback.bad{background:#a80018}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}#status{font-weight:700;color:white}#result{display:none}.small{font-size:13px;color:#ccc}#answer:focus{outline:2px solid #429eee}@media(max-height:650px){main{padding:8px 14px}#canvas{height:155px}h1{font-size:22px;margin:3px 0}.panel{padding:8px;margin:6px 0}input{padding:8px}.actions button{padding:8px}}@media(max-width:400px){#canvas{height:210px}}</style></head><body><main><section id="home"><h1>龍騰英文 B5 L3–L4</h1><p>108 課綱｜73 個單字｜每輪隨機 10 題。根據英文情境填入正確單字，不顯示中文題目提示。</p><div class="panel"><label for="lesson">選擇測驗範圍</label><select id="lesson"><option value="all">L3 + L4 混合（73 字）</option><option value="3">Lesson 3（37 字）</option><option value="4">Lesson 4（36 字）</option></select><div class="actions"><button class="primary" id="start">開始遊戲 / START</button></div></div><p class="small">⭐ 標示較長單字。</p></section><section id="quiz"><div id="status"></div><canvas id="canvas" aria-label="英文情境填空題目"></canvas><form id="form" autocomplete="off"><label for="answer">輸入英文單字</label><input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done"><div class="actions" id="answerActions"><button class="primary" type="submit">送出答案</button><button type="button" id="skip">跳過</button></div></form><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="next" class="primary" style="display:none">下一題 →</button></div></section><section id="result" class="panel"><h1>測驗完成！</h1><p id="score"></p><div id="review"></div><div class="actions"><button id="again" class="primary">再玩 10 題</button><button id="back">返回首頁</button></div></section></main><script>const WORDS=[{"w": "differ", "zh": "相異；不同意", "s": "Their opinions ____ on several important issues.", "lesson": 3, "star": false}, {"w": "differentiate", "zh": "區分；辨別", "s": "It can be difficult to ____ between two similar species.", "lesson": 3, "star": true}, {"w": "crew", "zh": "全體工作人員", "s": "The ship's ____ worked through the night.", "lesson": 3, "star": false}, {"w": "sailor", "zh": "水手；海員", "s": "The experienced ____ guided the ship through the storm.", "lesson": 3, "star": false}, {"w": "sail", "zh": "航行；帆", "s": "They plan to ____ across the Pacific Ocean.", "lesson": 3, "star": false}, {"w": "settle", "zh": "定居；解決", "s": "The family decided to ____ near the coast.", "lesson": 3, "star": false}, {"w": "settlement", "zh": "協議", "s": "Both sides finally reached a peaceful ____.", "lesson": 3, "star": true}, {"w": "settler", "zh": "移民；殖民者", "s": "The early ____ built a house beside the river.", "lesson": 3, "star": false}, {"w": "possess", "zh": "具有；擁有", "s": "Some animals ____ an excellent sense of smell.", "lesson": 3, "star": false}, {"w": "possession", "zh": "擁有；個人財產", "s": "The documents are now in her ____.", "lesson": 3, "star": true}, {"w": "exceptional", "zh": "傑出的；罕見的", "s": "Her ____ talent impressed the entire audience.", "lesson": 3, "star": true}, {"w": "exception", "zh": "例外", "s": "Every student must attend, without ____.", "lesson": 3, "star": false}, {"w": "strategic", "zh": "戰略的", "s": "The island occupies a ____ position along the trade route.", "lesson": 3, "star": false}, {"w": "strategy", "zh": "策略", "s": "The team developed a new ____ to solve the problem.", "lesson": 3, "star": false}, {"w": "opposite", "zh": "對面的；相反的；在……對面", "s": "The two friends sat on ____ sides of the table.", "lesson": 3, "star": false}, {"w": "core", "zh": "核心；中心部分", "s": "Trust lies at the ____ of a strong relationship.", "lesson": 3, "star": false}, {"w": "considerably", "zh": "相當大地；非常", "s": "The temperature dropped ____ overnight.", "lesson": 3, "star": true}, {"w": "considerable", "zh": "相當大的；重要的", "s": "The project requires a ____ amount of money.", "lesson": 3, "star": true}, {"w": "densely", "zh": "密集地", "s": "The city is ____ populated.", "lesson": 3, "star": false}, {"w": "dense", "zh": "密集的；濃的", "s": "A ____ fog covered the road.", "lesson": 3, "star": false}, {"w": "density", "zh": "密度；濃度", "s": "The population ____ is high in this district.", "lesson": 3, "star": false}, {"w": "majestic", "zh": "雄偉的；壯觀的", "s": "We admired the ____ mountains at sunrise.", "lesson": 3, "star": false}, {"w": "majesty", "zh": "雄偉壯觀；莊嚴", "s": "The visitors admired the ____ of the ancient palace.", "lesson": 3, "star": false}, {"w": "soar", "zh": "高聳；猛增", "s": "Housing prices may ____ when demand rises.", "lesson": 3, "star": false}, {"w": "valley", "zh": "山谷；溪谷", "s": "A small village lies deep in the ____.", "lesson": 3, "star": false}, {"w": "stream", "zh": "溪流；流動", "s": "A clear ____ runs through the forest.", "lesson": 3, "star": false}, {"w": "stark", "zh": "鮮明的；簡陋的", "s": "There is a ____ contrast between the two regions.", "lesson": 3, "star": false}, {"w": "liv  foods may ____ an allergic reaction.", "lesson": 4, "star": false}, {"w": "allergic", "zh": "過敏的", "s": "She is ____ to peanuts.", "lesson": 4, "star": false}, {"w": "allergy", "zh": "過敏反應", "s": "He developed an ____ to a certain food.", "lesson": 4, "star": false}, {"w": "reaction", "zh": "生理反應；回應", "s": "Her ____ to the news was surprisingly calm.", "lesson": 4, "star": false}, {"w": "react", "zh": "起反應；回應", "s": "How did the public ____ to the announcement?", "lesson": 4, "star": false}, {"w": "somewhat", "zh": "有點；有幾分", "s": "The second experiment was ____ more successful.", "lesson": 4, "star": false}, {"w": "alter", "zh": "改變；更動", "s": "Scientists may ____ the process to improve efficiency.", "lesson": 4, "star": false}, {"w": "suit", "zh": "滿足需要；合心意", "s": "The new schedule may not ____ everyone.", "lesson": 4, "star": false}, {"w": "suitable", "zh": "合適的；適宜的", "s": "This method is ____ for small-scale production.", "lesson": 4, "star": false}, {"w": "scale", "zh": "規模", "s": "The company hopes to produce the product on a larger ____.", "lesson": 4, "star": false}, {"w": "comprehensive", "zh": "詳盡的；全面的", "s": "The report provides a ____ analysis of the issue.", "lesson": 4, "star": true}];let deck=[],idx=0,correct=0,history=[],locked=false;const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){const v=$('lesson').value;deck=shuffle(WORDS.filter(x=>v==='all'||String(x.lesson)===v).slice()).slice(0,10);idx=0;correct=0;history=[];$('home').style.display='none';$('result').style.display='none';$('quiz').style.display='block';show()}function wrap(ctx,text,x,y,maxWidth,lineHeight){let words=text.split(' '),line='';for(const w of words){let next=line?line+' '+w:w;if(ctx.measureText(next).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=w}else line=next}ctx.fillText(line,x,y);return y+lineHeight}function draw(){const c=$('canvas'),dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#000';ctx.fillRect(0,0,r.width,r.height);const item=deck[idx];if(!item)return;let fs=r.width<430?19:25;ctx.textBaseline='top';ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText('LESSON '+item.lesson+(item.star?' ⭐':''),12,9);ctx.font='600 '+fs+'px system-ui';let y=wrap(ctx,item.s.replace('____','_______'),12,45,r.width-24,fs*1.55);ctx.font='16px system-ui';ctx.fillStyle='#fff';wrap(ctx,'提示：'+item.w[0]+'…'+item.w.at(-1),12,Math.min(y+13,r.height-25),r.width-24,22)}function show(){locked=false;$('status').textContent='第 '+(idx+1)+' / 10 題 · 已答對 '+correct+' 題';$('answer').value='';$('answer').disabled=false;$('answerActions').style.display='flex';$('feedback').style.display='none';$('next').style.display='none';draw()}function submit(skip=false){if(locked)return;let a=$('answer').value.trim().toLowerCase(),w=deck[idx];if(!skip&&!a)return;locked=true;let ok=!skip&&a===w.w.toLowerCase();if(ok)correct++;history.push({w:w.w,zh:w.zh,ok,answer:skip?'（跳過）':a});let f=$('feedback');f.className=ok?'good':'bad';f.style.display='block';f.textContent=(ok?'✓ 答對！':skip?'✕ 已跳過':'✕ 答錯')+'\n正確單字：'+w.w+'\n中文釋義：'+w.zh+(ok?'':'\n你的答案：'+(skip?'（跳過）':a));f.style.whiteSpace='pre-line';$('answer').disabled=true;$('answerActions').style.display='none';$('next').style.display='block';$('next').textContent=idx===9?'查看成績':'下一題 →'}function next(){idx++;if(idx<10){show();return}$('quiz').style.display='none';$('result').style.display='block';$('score').textContent='答對 '+correct+' / 10 題';$('review').replaceChildren();history.forEach((h,i)=>{let p=document.createElement('p');p.textContent=(i+1)+'. '+(h.ok?'✓':'✕')+' '+h.w+' — '+h.zh+(h.ok?'':'（你填：'+h.answer+'）');$('review').append(p)})}function adjust(){if($('quiz').style.display==='block')draw()}$('start').onclick=start;$('again').onclick=start;$('back').onclick=()=>{$('result').style.display='none';$('home').style.display='block'};$('form').onsubmit=e=>{e.preventDefault();submit()};$('skip').onclick=()=>submit(true);$('next').onclick=next;window.addEventListener('resize',adjust);if(window.visualViewport)window.visualViewport.addEventListener('resize',adjust);</script></body></html>
