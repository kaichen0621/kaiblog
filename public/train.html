<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙軌轉乘神器 - 台鐵六家線 ↔ 高鐵新竹站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

<div class="min-h-full pb-12">
  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-slate-900 text-white py-6 px-4 shadow-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center backdrop-blur-md border border-white/20">
          <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">雙軌轉乘最佳化查詢</h1>
          <p class="text-xs text-blue-200">台鐵六家線 ↔ 高鐵新竹站 (2F空橋直連)</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2.5 py-1 rounded-full font-medium">全天即時對照</span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 -mt-3">
    <!-- Main Control Panel -->
    <div class="glass-card rounded-2xl shadow-xl border border-slate-200/80 p-5 space-y-5 mb-6">
      
      <!-- Direction Tabs -->
      <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-xl border border-slate-200">
        <button id="tabOutbound" onclick="switchDirection('outbound')" 
          class="py-2.5 px-3 rounded-lg font-semibold text-sm transition-all duration-200 shadow-sm bg-white text-blue-700 flex items-center justify-center space-x-1.5">
          <span>🚆 去程：台鐵 ➔ 高鐵</span>
        </button>
        <button id="tabInbound" onclick="switchDirection('inbound')" 
          class="py-2.5 px-3 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5">
          <span>🚄 回程：高鐵 ➔ 台鐵</span>
        </button>
      </div>

      <!-- Route Details Selector -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5" id="lblOrigin">起點車站</label>
          <div class="w-full py-2.5 px-3 bg-slate-100 border border-slate-200 rounded-xl text-slate-700 font-medium text-sm flex items-center justify-between" id="boxOrigin">
            <span>台鐵新竹站 (新竹)</span>
            <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded">台鐵</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5" id="lblDestination">高鐵端點站</label>
          <select id="selectDest" onchange="calculateRoutes()" 
            class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-xl font-medium text-sm text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="Taipei" selected>台北車站 (Taipei)</option>
            <option value="Banqiao">板橋車站 (Banqiao)</option>
            <option value="Taoyuan">桃園車站 (Taoyuan)</option>
            <option value="Taichung">台中車站 (Taichung)</option>
            <option value="Zuoying">左營車站 (Zuoying)</option>
          </select>
        </div>
      </div>

      <!-- Time Input Controls -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <label for="timeInput" class="text-xs font-semibold text-slate-600 uppercase tracking-wider" id="lblTimeTitle">
            預計出發時間 (支援多種格式，如 15:30 或 1530)
          </label>
          <button onclick="setNowTime()" class="text-xs font-medium text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            帶入現在時間
          </button>
        </div>

        <div class="relative">
          <input type="text" id="timeInput" value="15:30" placeholder="例如：15:30 或 1530" 
            class="w-full text-lg font-bold tracking-wide py-3 px-4 border-2 border-slate-300 rounded-xl focus:border-blue-600 focus:ring-0 outline-none transition text-slate-800"
            oninput="handleTimeInput(event)" onkeydown="if(event.key==='Enter') calculateRoutes()">
          <div class="absolute right-3 top-3 text-xs font-medium text-slate-400 bg-slate-100 px-2 py-1 rounded">24小時制</div>
        </div>

        <!-- Quick Time Presets -->
        <div class="flex flex-wrap gap-1.5 pt-1">
          <span class="text-xs text-slate-400 self-center mr-1">快捷選擇:</span>
          <button onclick="setTimePreset('07:30')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg border border-slate-200 transition">07:30 早班</button>
          <button onclick="setTimePreset('12:00')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg border border-slate-200 transition">12:00 中午</button>
          <button onclick="setTimePreset('15:30')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg border border-slate-200 transition">15:30 下午</button>
          <button onclick="setTimePreset('18:00')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg border border-slate-200 transition">18:00 晚高峰</button>
          <button onclick="setTimePreset('20:30')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg border border-slate-200 transition">20:30 晚間</button>
        </div>

      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-bold text-slate-600 tracking-wide uppercase" id="resultHeader">最適接駁方案 (依轉乘效率排序)</h2>
        <span id="resultCount" class="text-xs bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">-- 筆</span>
      </div>

      <div id="resultsList" class="space-y-4">
        <!-- Route cards injected dynamically -->
      </div>
    </div>
  </main>
</div>

// 3. THSR: Full Day High Speed Rail Timetable Generators
function generateTHSRData() {
  const hsr = {
    // Hsinchu -> Taipei (Northbound)
    hsinchu_taipei: [],
    // Taipei -> Hsinchu (Southbound)
    taipei_hsinchu: [],
    // Hsinchu -> Taichung (Southbound)
    hsinchu_taichung: [],
    // Taichung -> Hsinchu (Northbound)
    taichung_hsinchu: []
  };

  // Generate Hsinchu -> Taipei (06:30 to 22:30, approx 2-3 trains per hour)
  for (let h = 6; h <= 22; h++) {
    const hh = String(h).padStart(2, '0');
    // Regular trains
    hsr.hsinchu_taipei.push({ no: `6${hh}`, dep: `${hh}:00`, arr: `${String(h).padStart(2,'0')}:33` });
    hsr.hsinchu_taipei.push({ no: `15${hh}`, dep: `${hh}:22`, arr: `${String(h).padStart(2,'0')}:55` });
    if (h < 22) {
      hsr.hsinchu_taipei.push({ no: `6${hh}8`, dep: `${hh}:48`, arr: `${String(h + 1).padStart(2,'0')}:21` });
    }
  }

  // Generate Taipei -> Hsinchu
  for (let h = 6; h <= 22; h++) {
    const hh = String(h).padStart(2, '0');
    hsr.taipei_hsinchu.push({ no: `6${hh}3`, dep: `${hh}:00`, arr: `${hh}:32` });
    hsr.taipei_hsinchu.push({ no: `15${hh}3`, dep: `${hh}:15`, arr: `${hh}:48` });
    if (h < 22) {
      hsr.taipei_hsinchu.push({ no: `6${hh}9`, dep: `${hh}:35`, arr: `${String(h + 1).padStart(2,'0')}:08` });
    }
  }

  return hsr;
}

const THSR_DATA = generateTHSRData();

// Destination offsets relative to Taipei/Taichung
const DEST_CONFIG = {
  Taipei: { name: '台北車站', timeDiff: 0 },
  Banqiao: { name: '板橋車站', timeDiff: -8 },
  Taoyuan: { name: '桃園車站', timeDiff: -15 },
  Taichung: { name: '台中車站', timeDiff: 28 },
  Zuoying: { name: '左營車站', timeDiff: 60 }
};

let currentDirection = 'outbound'; // 'outbound' or 'inbound'

function switchDirection(dir) {
  currentDirection = dir;
  const btnOut = document.getElementById('tabOutbound');
  const btnIn = document.getElementById('tabInbound');
  const lblOrigin = document.getElementById('lblOrigin');
  const boxOrigin = document.getElementById('boxOrigin');
  const lblDest = document.getElementById('lblDestination');
  const lblTimeTitle = document.getElementById('lblTimeTitle');

    boxOrigin.innerHTML = '<span>台鐵新竹站 (新竹)</span><span class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">台鐵</span>';

    lblTimeTitle.innerText = '預計出發時間 (從台鐵新竹站起算)';

    btnIn.className = 'py-2.5 px-3 rounded-lg font-semibold text-sm transition-all duration-200 shadow-sm bg-white text-blue-700 flex items-center justify-center space-x-1.5';
    btnOut.className = 'py-2.5 px-3 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5';
    lblOrigin.innerText = '終點車站';
    boxOrigin.innerHTML = '<span>台鐵新竹站 (新竹)</span><span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">台鐵終點</span>';
    lblDest.innerText = '高鐵出發地';
    lblTimeTitle.innerText = '預計出發時間 (從高鐵站起算)';
  }

}

function parseTimeToMinutes(str) {
  if (!str) return null;
  let clean = str.replace(/[^0-9]/g, '');
  if (clean.length === 1 || clean.length === 2) {
    clean = clean.padStart(2, '0') + '00';
  } else if (clean.length === 3) {
    clean = '0' + clean;
  }
  if (clean.length === 4) {
    const h = parseInt(clean.substring(0, 2), 10);
    const m = parseInt(clean.substring(2, 4), 10);
    if (h >= 0 && h < 24 && m >= 0 && m < 60) {
      return h * 60 + m;
    }
  }
  return null;
}

function minToTimeString(mins) {
  const h = String(Math.floor(mins / 60)).padStart(2, '0');
  const m = String(mins % 60).padStart(2, '0');
  return `${h}:${m}`;
}

function handleTimeInput(e) {
  calculateRoutes();
}

function setNowTime() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('timeInput').value = `${hh}:${mm}`;
  calculateRoutes();
}

function setTimePreset(timeStr) {
  document.getElementById('timeInput').value = timeStr;
  calculateRoutes();
}

function calculateRoutes() {
  const rawTime = document.getElementById('timeInput').value;
  const startMin = parseTimeToMinutes(rawTime);
  const destKey = document.getElementById('selectDest').value;
  const resultsContainer = document.getElementById('resultsList');
  const resultCount = document.getElementById('resultCount');

  if (startMin === null) {
    resultsContainer.innerHTML = `
      <div class="p-6 bg-red-50 border border-red-200 rounded-xl text-center text-red-600 text-sm">
        ⚠️️ 時間格式無法解析，請輸入如 <b>15:30</b> 或 <b>1530</b>。
      </div>`;
    resultCount.innerText = "0 筆";
    return;
  }

  const results = [];
  const MIN_TRANSFER_BUFFER = 6;  // minimum 6 mins to walk skybridge
  const MAX_TRANSFER_WAIT = 25;   // max wait time to avoid showing dead waiting slots

  if (currentDirection === 'outbound') {
    // OUTBOUND: TRA Hsinchu -> TRA Liujia -> THSR Hsinchu -> Dest
    const destInfo = DEST_CONFIG[destKey];
    
    // Get valid THSR trains from Hsinchu
    const hsrList = THSR_DATA.hsinchu_taipei; // base reference

    // For each THSR train starting after user startMin + 25 mins (approx minimum journey)
    hsrList.forEach(hsr => {
      const hsrDepMin = parseTimeToMinutes(hsr.dep);
      if (hsrDepMin < startMin + 20) return;

      // Find the LATEST TRA train that arrives at Liujia at least MIN_TRANSFER_BUFFER before hsrDepMin
      // and departs Hsinchu >= startMin
      let bestTra = null;
      let bestBuffer = 999;

      TRA_HSINCHU_TO_LIUJIA.forEach(tra => {
        const traDepMin = parseTimeToMinutes(tra.dep);
        const traArrMin = parseTimeToMinutes(tra.arr);

        if (traDepMin >= startMin) {
          const buffer = hsrDepMin - traArrMin;
          if (buffer >= MIN_TRANSFER_BUFFER && buffer <= MAX_TRANSFER_WAIT) {
            if (buffer < bestBuffer) {
              bestBuffer = buffer;
              bestTra = tra;
            }
          }
        }
      });

      if (bestTra) {
        // Adjust THSR arrival time according to destination
        const baseHsrArrMin = parseTimeToMinutes(hsr.arr);
        const finalArrMin = baseHsrArrMin + destInfo.timeDiff;

        results.push({
          tra: bestTra,
          hsr: {
            no: hsr.no,
            dep: hsr.dep,
            arr: minToTimeString(finalArrMin)
          },
          buffer: bestBuffer,
          totalDuration: finalArrMin - parseTimeToMinutes(bestTra.dep),
          destName: destInfo.name
        });
      }
    });

  } else {
    // INBOUND: Dest -> THSR Hsinchu -> TRA Liujia -> TRA Hsinchu
    const destInfo = DEST_CONFIG[destKey];
    const hsrList = THSR_DATA.taipei_hsinchu; // reference THSR to Hsinchu

    hsrList.forEach(hsr => {
      const hsrDepMin = parseTimeToMinutes(hsr.dep);
      if (hsrDepMin < startMin) return;

      const hsrArrMin = parseTimeToMinutes(hsr.arr);

      // Find the EARLIEST TRA train from Liujia -> Hsinchu after THSR arrival
      let bestTra = null;
      let bestBuffer = 999;

      TRA_LIUJIA_TO_HSINCHU.forEach(tra => {
        const traDepMin = parseTimeToMinutes(tra.dep);
        const buffer = traDepMin - hsrArrMin;

        if (buffer >= MIN_TRANSFER_BUFFER && buffer <= MAX_TRANSFER_WAIT) {
          if (buffer < bestBuffer) {
            bestBuffer = buffer;
            bestTra = tra;
          }
        }
      });

      if (bestTra) {
        results.push({
          hsr: {
            no: hsr.no,
            dep: hsr.dep,
            arr: hsr.arr
          },
          tra: bestTra,
          buffer: bestBuffer,
          totalDuration: parseTimeToMinutes(bestTra.arr) - hsrDepMin,
          originName: destInfo.name
        });
      }
    });
  }

  resultCount.innerText = `${results.length} 筆方案`;

  if (results.length === 0) {
    resultsContainer.innerHTML = `
      <div class="p-8 bg-white rounded-2xl border border-slate-200 text-center space-y-2">
        <div class="text-3xl">🌙</div>
        <div class="font-bold text-slate-700">該時間段無最佳銜接班次</div>
        <p class="text-xs text-slate-500">可能是班次較稀疏或已超過末班車時間，請嘗試微調出發時間。</p>
      </div>`;
    return;
  }

  resultsContainer.innerHTML = '';

  // Render top 8 optimal solutions
  results.slice(0, 8).forEach((plan, idx) => {
    let bufferBadgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
    let bufferLabel = '最佳轉乘時間';

    if (plan.buffer > 15) {
      bufferBadgeClass = 'bg-amber-100 text-amber-800 border-amber-300';
      bufferLabel = '轉乘時間充裕';
    }
