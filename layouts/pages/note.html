{{ define "main" }}
<header class="page-header">
  <h1>文字牆</h1>
</header>

<div id="notes-grid" class="notes-grid-container"></div>

<style>
.notes-grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.note-card {
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 18px; /* 圓角設計 */
  padding: 18px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  font-size: 15px;
  line-height: 1.6;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.note-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
}
.dark .note-card {
  background: rgba(32, 32, 34, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.note-card.is-now {
  border: 1.5px solid #007aff; /* 24小時內的最新便利貼醒目外框 */
}
</style>

<script>
fetch('/notes.txt')
  .then(res => res.text())
  .then(data => {
    const container = document.getElementById('notes-grid');
    const parts = data.split('---');
    
    let allNotes = [];
    
    // 處理最新便利貼
    if (parts[0]) {
      const nowText = parts[0].trim();
      if (nowText) allNotes.push({ text: nowText, isNow: true });
    }
    
    // 處理歷史便利貼 (按 - 符號拆分)
    if (parts[1]) {
      const archiveLines = parts[1].split('\n');
      archiveLines.forEach(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith('-')) {
          let text = trimmed.replace(/^-/, '').trim();
          if (text) allNotes.push({ text: text, isNow: false });
        }
      });
    }
    
    // 渲染卡片牆
    allNotes.forEach(note => {
      const card = document.createElement('div');
      card.className = `note-card ${note.isNow ? 'is-now' : ''}`;
      card.innerText = note.text;
      container.appendChild(card);
    });
  });
</script>
{{ end }}
