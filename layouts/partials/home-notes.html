<div id="home-sticky-note" class="sticky-note-banner" style="display: none;">
  <div class="note-content-wrapper">
    <span class="note-badge">📌 便利貼</span>
    <p id="note-text-display"></p>
    <a href="/notes" class="note-more-link">動態牆 &rarr;</a>
  </div>
</div>

<style>
.sticky-note-banner {
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  margin: 15px 0;
  box-shadow: var(--shadow);
}
.note-content-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.note-badge {
  background: var(--primary);
  color: var(--theme);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
  white-space: nowrap;
}
#note-text-display {
  margin: 0;
  flex-grow: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--content);
}
.note-more-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
}
</style>

<script>
// 自動把便利貼搬到社交圖示下方、文章列表上方
document.addEventListener("DOMContentLoaded", function() {
  const socialIcons = document.querySelector('.social-icons');
  const stickyNote = document.getElementById('home-sticky-note');
  
  if (socialIcons && stickyNote) {
    socialIcons.parentNode.insertBefore(stickyNote, socialIcons.nextSibling);
  }

  // 讀取 notes.txt 內容
  fetch('/notes.txt')
    .then(res => res.text())
    .then(data => {
      if (data.includes('<!DOCTYPE html>') || data.includes('<html')) return;
      const parts = data.split('---');
      if (parts.length > 0) {
        const nowContent = parts[0].trim();
        if (nowContent) {
          document.getElementById('note-text-display').innerText = nowContent;
          stickyNote.style.display = 'block';
        }
      }
    });
});
</script>
