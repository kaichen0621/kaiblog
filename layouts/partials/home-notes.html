<div id="home-sticky-note" class="sticky-note-banner" style="display: none;">
  <div class="note-content-wrapper">
    <span class="note-badge">📌 便利貼</span>
    <p id="note-text-display"></p>
    <a href="/notes" class="note-more-link">動態牆 &rarr;</a>
  </div>
</div>

<style>
.sticky-note-banner {
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  margin: 15px 0;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease;
}
.sticky-note-banner:hover {
  transform: translateY(-2px);
}
.note-content-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.note-badge {
  background: var(--primary);
  color: var(--theme);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
  white-space: nowrap;
}
#note-text-display {
  margin: 0;
  flex-grow: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--content);
}
.note-more-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
}
.note-more-link:hover {
  text-decoration: underline;
}
</style>

<script>
fetch('/notes.txt')
  .then(res => res.text())
  .then(data => {
    // 確保抓到的不是整頁 HTML，而是以純文字處理
    if (data.includes('<!DOCTYPE html>') || data.includes('<html')) {
      console.error("錯誤：抓到 HTML 網頁，請檢查 notes.txt 路徑是否正確");
      return;
    }
    const parts = data.split('---');
    if (parts.length > 0) {
      const nowContent = parts[0].trim();
      if (nowContent) {
        document.getElementById('note-text-display').innerText = nowContent;
        document.getElementById('home-sticky-note').style.display = 'block';
      }
    }
  })
  .catch(err => console.error("無法載入 notes.txt", err));
</script>
