{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>

<div class="post-content">
  <div id="notes-grid" class="notes-grid-container"></div>
</div>

<style>
.notes-grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.note-card {
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  font-size: 15px;
  line-height: 1.6;
  color: var(--content);
  transition: transform 0.2s ease;
}
.note-card:hover {
  transform: translateY(-2px);
}
.note-card.is-now {
  border: 1.5px solid var(--primary);
}
</style>

<script>
fetch('/notes.txt')
  .then(res => res.text())
  .then(data => {
    const container = document.getElementById('notes-grid');
    if (!container) return;
    const parts = data.split('---');
    
    let allNotes = [];
    
    // 取得最新便利貼
    if (parts[0]) {
      const nowText = parts[0].trim();
      if (nowText) allNotes.push({ text: nowText, isNow: true });
    }
    
    // 取得歷史便利貼
    if (parts[1]) {
      const archiveLines = parts[1].split('\n');
      archiveLines.forEach(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith('-')) {
          let text = trimmed.replace(/^-/, '').trim();
          if (text) allNotes.push({ text: text, isNow: false });
        }
      });
    }
    
    // 渲染卡片
    allNotes.forEach(note => {
      const card = document.createElement('div');
      card.className = `note-card ${note.isNow ? 'is-now' : ''}`;
      card.innerText = note.text;
      container.appendChild(card);
    });
  });
</script>
{{ end }}
