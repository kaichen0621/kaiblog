{{ $id := .Get "id" | default "default" }}
<div class="kai-paid-lock" data-id="{{ $id }}">
  <div class="lock-ui" style="margin: 2.5rem 0; padding: 2.5rem 2rem; border-radius: 30px; border: 2px solid var(--border); background: var(--code-bg); text-align: center; box-sizing: border-box;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
    <h3 style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 0.2rem; line-height: 1.4;">
      目前停止開放下載！<br />
      <span style="font-size: 1.5rem; color: #ee4242; font-weight: 900; margin-bottom: 0.8rem; display: inline-block;">請至首頁查看最新版本</span>
    </h3>
    <p style="font-size: 0.95rem; opacity: 0.8; margin-bottom: 1.5rem; font-weight: 500; line-height: 1.5; color: var(--secondary);">
      輸入密碼才能查看<br />
      <span style="font-size: 0.85rem; color: var(--primary); font-weight: bold;">💡 管理員專屬</span>
    </p>
    <input type="password" class="lock-input" placeholder="5525+2 位數字密碼" style="width: 100%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.05); color: var(--primary); font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 10px; box-sizing: border-box;" />
    <p class="lock-error" style="color: #ff4d4f; font-size: 0.85rem; display: none; margin-bottom: 8px; font-weight: 700;">❌ 密碼錯誤</p>
    <br />
    <button class="lock-btn" style="width: 100%; max-width: 400px; padding: 14px; font-size: 1rem; font-weight: 700; color: #383838; background: #ffdd00; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 221, 0, 0.25);">我是管理員！</button>
  </div>

  <div class="unlocked-content" style="display: none;">
    {{ .Inner | markdownify }}
  </div>
</div>

<script>
(function() {
  const container = document.querySelector('.kai-paid-lock[data-id="{{ $id }}"]');
  if (!container) return;

  const storageKey = `kai_blog_unlocked_01_{{ $id }}`;
  const CORRECT_PASSCODE = 'resolve';

  const lockUi = container.querySelector('.lock-ui');
  const content = container.querySelector('.unlocked-content');
  const input = container.querySelector('.lock-input');
  const btn = container.querySelector('.lock-btn');
  const errorMsg = container.querySelector('.lock-error');

  function update() {
    if (localStorage.getItem(storageKey) === 'true') {
      lockUi.style.display = 'none';
      content.style.display = 'block';
    } else {
      lockUi.style.display = 'block';
      content.style.display = 'none';
    }
  }

  if (btn) {
    btn.addEventListener('click', function() {
      if (input.value === CORRECT_PASSCODE) {
        localStorage.setItem(storageKey, 'true');
        update();
      } else {
        errorMsg.style.display = 'block';
        setTimeout(() => { errorMsg.style.display = 'none'; }, 2000);
      }
    });

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') btn.click();
    });
  }

  update();
})();
</script>
