baseURL = "https://kaiblog.is-a.dev/"
locale = "zh-tw"
defaultContentLanguage = "zh-tw"
title = "KAI BLOG"
theme = "PaperMod"

enableInlineShortcodes = true
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true
buildDrafts = false
buildFuture = false
buildExpired = false
paginate = 15
summaryLength = 140

[minify]
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 自定義文章永久連結格式為 `/:title/`
[permalinks]
  [permalinks.page]
    blog = "/blog/:slugorcontentbasename/"


  [menu]
    [[menu.main]]
      identifier = "blog"
      name = "BLOG"
      url = "/blog/"
      weight = 10

    [[menu.main]]
      identifier = "archives"
      name = "列表"
      url = "/archives/"
      weight = 20

    [[menu.main]]
      identifier = "docs"
      name = "文件"
      url = "/docs/"
      weight = 30

    #[[menu.main]]
     # identifier = "tools"
     # name = "工具"
    #  url = "/tools/"
    #  weight = 40

    [[menu.main]]
      identifier = "random"
      name = "隨機"
      url = "/random/"
      weight = 50
    [[menu.main]]
  identifier = "guestbook"
  name = '<span style="display:inline-flex;align-items:center;" aria-label="留言板"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="8" y1="9" x2="16" y2="9"></line><line x1="8" y1="13" x2="13" y2="13"></line></svg></span>'
  url = "/guestbook/"
  weight = 60


    # [[menu.main]]
     # identifier = "notes"
    #  name = "note"
    #  url = "/blog/notes"
    #  weight = 100

   # [[menu.main]]
   #   identifier = "use"
   #   name = "愛用"
   #   url = "/use/"
   #   weight = 70

   # [[menu.main]]
   #   identifier = "now"
   #   name = "近況"
   #   url = "/now/"
   #   weight = 80

    [[menu.main]]
      identifier = "search"
      name = "搜尋"
      url = "/search/"
      weight = 90

    [[menu.main]]
     # identifier = "tags"
     # name = "標籤"
     # url = "/tags/"
     # weight = 100

    [[menu.main]]
      identifier = "about"
      name = "關於"
      url = "/about/"
      weight = 110


[params]

  env = "production"
  description = "KAI BLOG 每日筆記"
  author = "Kai"
  defaultTheme = "auto"
  disableThemeToggle= false
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCounts = true
  ShowLastMod = true
  ShowToc = true
  TocOpen = true
  comments = true

  [params.homeInfoParams]
    Title = "歡迎來到 KAI BLOG"
    Content = """
往下滑看看吧       
**第一次來這裡嗎？**
先去 [關於](/about) 看看
"""

  # 網站左上角標籤配置
  [params.label]
    text = "KAI BLOG"
    icon = "/img/KAI_LOGO_B.png"
    iconHeight = 35

  # 社交圖標
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/kaichen0621"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@kaistudio-621"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  # 封面顯示策略
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = true

  # 搜尋配置 (Fuse.js)
  [params.fuseOpts]
    keys = ["title", "permalink", "summary"]

  # 頁腳版權年份 (修正為整數)
  StartYear = 2025
  EndYear = 2026
  [params.assets]
      favicon = "/img/favicon_io/favicon.ico"
      favicon16x16 = "/img/favicon_io/favicon-16x16.png"
      favicon32x32 = "/img/favicon_io/favicon-32x32.png"

# 允許在 Markdown 中使用原始 HTML
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # 允許 Markdown 檔案中直接解析 HTML 標籤

# 添加 series（系列）與 tag 作為分類方式
[taxonomies]
  tag = "tags"
  series = "series"
